<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Practice Game - Debug</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        const FrenchPracticeGame = () => {
          const [gameMode, setGameMode] = useState(null);

          console.log('Component rendered, gameMode:', gameMode);

          if (!gameMode) {
            return (
              <div style={{padding: '50px', textAlign: 'center'}}>
                <h1 style={{fontSize: '40px', marginBottom: '30px'}}>🇫🇷 French Practice Game</h1>
                <button 
                  onClick={() => {
                    console.log('Button clicked!');
                    setGameMode('seasons');
                  }}
                  style={{
                    padding: '20px 40px',
                    fontSize: '24px',
                    margin: '10px',
                    cursor: 'pointer',
                    backgroundColor: '#4CAF50',
                    color: 'white',
                    border: 'none',
                    borderRadius: '10px'
                  }}
                >
                  Test Button - Click Me
                </button>
              </div>
            );
          }

          return (
            <div style={{padding: '50px', textAlign: 'center'}}>
              <h1 style={{fontSize: '40px'}}>Game Mode: {gameMode}</h1>
              <button 
                onClick={() => setGameMode(null)}
                style={{
                  padding: '20px 40px',
                  fontSize: '24px',
                  margin: '10px',
                  cursor: 'pointer',
                  backgroundColor: '#2196F3',
                  color: 'white',
                  border: 'none',
                  borderRadius: '10px'
                }}
              >
                Back to Menu
              </button>
              <p style={{fontSize: '20px', marginTop: '30px'}}>
                If you can see this, React state is working!
              </p>
            </div>
          );
        };

        console.log('Script loaded');
        ReactDOM.render(<FrenchPracticeGame />, document.getElementById('root'));
        console.log('React rendered');
    </script>
</body>
</html>
